[project]
name = "jhtracker-backend"
version = "0.1.0"
description = "AI-driven Local Job Hunter Platform (JHTracker) Backend with FastMCP & FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "fastmcp>=0.4.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
