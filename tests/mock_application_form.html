<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业校招网申系统模拟页面</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>2027届校园招聘网申系统</h2>
    <form>
        <div class="form-group">
            <label>真实姓名</label>
            <input type="text" name="candidate_name" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>联系电话</label>
            <input type="tel" name="mobile" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>电子邮箱</label>
            <input type="email" name="email" placeholder="请输入常用邮箱">
        </div>
        <div class="form-group">
            <label>毕业院校（最高学历）</label>
            <input type="text" name="school" placeholder="请输入学校名称">
        </div>
        <div class="form-group">
            <label>所学专业</label>
            <input type="text" name="major" placeholder="请输入专业">
        </div>
        <div class="form-group">
            <label>期望工作城市</label>
            <input type="text" name="city" placeholder="如：深圳/上海">
        </div>
        <div class="form-group">
            <label>自我评价与个人优势</label>
            <textarea name="self_evaluation" rows="4" placeholder="请简要介绍您的技术优势与项目经历"></textarea>
        </div>
    </form>
</body>
</html>
