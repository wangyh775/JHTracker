{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div class="dashboard-title"><i class="bi bi-person-gear me-2 text-primary"></i>个人画像</div>
  <form method="post" action="/profile/upload" enctype="multipart/form-data" class="d-inline">
    <input type="file" name="resume" accept=".pdf,.docx" class="d-none" id="resumeInput">
    <button type="button" class="btn btn-sm btn-outline-info" onclick="document.getElementById('resumeInput').click()"><i class="bi bi-file-earmark-arrow-up me-1"></i>上传简历解析</button>
    <button type="submit" class="btn btn-sm btn-outline-success d-none" id="resumeSubmitBtn">解析并更新</button>
  </form>
</div>

<div class="row g-3">
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title mb-3"><i class="bi bi-pencil-square me-2"></i>编辑画像</h6>
        <form method="post" action="/profile/save">
          <div class="mb-3">
            <textarea class="form-control font-monospace small" name="content" rows="30" style="font-size:0.85rem; line-height:1.5;">{{ content }}</textarea>
          </div>
          <button class="btn btn-primary"><i class="bi bi-floppy me-1"></i>保存</button>
          <span class="text-secondary small ms-3">保存后建议重新评分以更新匹配度</span>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title mb-3"><i class="bi bi-info-circle me-2"></i>说明</h6>
        <ul class="small text-secondary" style="line-height:1.8; padding-left:1rem;">
          <li>这里保存你的个人简历/画像，用于 AI 评分引擎生成匹配度</li>
          <li>支持上传 PDF/Word 简历自动解析</li>
          <li>修改后点击「AI 评分」按钮以更新匹配度</li>
          <li>建议格式：<br>
            <code>## 教育背景<br>
            ## 核心技术栈<br>
            ## 项目经验<br>
            ## 目标岗位<br>
            ## 求职偏好</code>
          </li>
        </ul>
      </div>
    </div>
    <div class="card mt-3">
      <div class="card-body">
        <h6 class="card-title mb-3"><i class="bi bi-shuffle me-2"></i>评分策略</h6>
        <div class="small text-secondary" style="line-height:1.8;">
          <label class="form-check mb-2">
            <input class="form-check-input" type="radio" name="scoreStrategy" value="full" checked>
            <span class="ms-1">全量重新评分（耗时较长）</span>
          </label>
          <label class="form-check">
            <input class="form-check-input" type="radio" name="scoreStrategy" value="incremental">
            <span class="ms-1">仅更新空缺评分（推荐）</span>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('resumeInput').addEventListener('change', function() {
  if (this.files.length > 0) {
    document.getElementById('resumeSubmitBtn').classList.remove('d-none');
    document.getElementById('resumeSubmitBtn').textContent = '解析 ' + this.files[0].name;
  }
});
</script>
{% endblock %}
