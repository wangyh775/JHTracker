<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JHTracker — 求职全流程管理</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link href="{{ url_for('static', filename='vendor/css/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/css/bootstrap-icons.css') }}" rel="stylesheet">
<script src="{{ url_for('static', filename='vendor/js/chart.umd.min.js') }}"></script>
<style>
:root {
  --bg-primary: #111;
  --bg-card: #1a1a1a;
  --bg-card-hover: #1f1f1f;
  --border: #2a2a2a;
  --text-primary: #e0e0e0;
  --text-secondary: #aaa;
  --accent: #0d6efd;
  --shadow: 0 2px 8px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.25);
  --radius: 12px;
  --transition: all 0.15s ease;
}
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
}
.sidebar {
  background: var(--bg-card);
  min-height: 100vh;
  border-right: 1px solid var(--border);
}
.sidebar .nav-link {
  color: var(--text-secondary);
  padding: 0.6rem 1rem;
  border-radius: 6px;
  margin: 2px 0;
  transition: var(--transition);
  position: relative;
}
.sidebar .nav-link:hover {
  color: #fff;
  background: #2a2a2a;
}
.sidebar .nav-link.active {
  color: #fff;
  background: var(--accent);
}
.sidebar .nav-link.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 60%;
  background: #fff;
  border-radius: 2px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  transition: var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-hover); }
.stat-card .num { font-size: 2rem; font-weight: 700; }
.badge-priority-S { background: #dc3545; }
.badge-priority-A { background: #fd7e14; }
.badge-priority-B { background: #0d6efd; }
.badge-priority-C { background: #6c757d; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.funnel-bar { height: 24px; border-radius: 4px; margin: 2px 0; transition: width 0.3s; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: var(--transition);
}
.card:hover { box-shadow: var(--shadow-hover); }
.modal-content { background: var(--bg-card); border: 1px solid #333; }
.table { color: var(--text-primary); }
.table-hover tbody tr {
  transition: var(--transition);
  position: relative;
}
.table-hover tbody tr:hover {
  color: #fff;
  background: var(--bg-card-hover);
  box-shadow: inset 3px 0 0 var(--accent);
}
.form-control, .form-select {
  background: #222;
  border: 1px solid #333;
  color: var(--text-primary);
  transition: var(--transition);
}
.form-control:focus, .form-select:focus {
  background: #222;
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.25);
}
.btn { transition: var(--transition); }
.btn-outline-light:hover { color: #000; }
.badge { border-radius: 6px; padding: 0.4em 0.7em; }
a { color: #6ea8fe; transition: var(--transition); }
a:hover { color: #8ab4ff; }
.dashboard-title { font-size: 1.5rem; font-weight: 600; }
.funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.funnel-label { width: 80px; text-align: right; font-size: 0.85rem; flex-shrink: 0; }
.funnel-bar-wrap { flex: 1; background: #222; border-radius: 4px; overflow: hidden; }
.funnel-bar-fill { height: 22px; border-radius: 4px; }
.funnel-count { width: 40px; text-align: right; font-size: 0.85rem; flex-shrink: 0; }
.bi { font-size: 14px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
.urgent-banner {
  background: linear-gradient(90deg, rgba(220,53,69,0.15), rgba(255,193,7,0.15));
  border: 1px solid rgba(220,53,69,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
}
/* 统一操作按钮栏 */
.action-bar {
  display: inline-flex !important;
  align-items: center !important;
  gap: 6px !important;
  vertical-align: middle !important;
}
.action-bar form {
  display: inline-flex !important;
  align-items: center !important;
  margin: 0 !important;
  padding: 0 !important;
}
.action-bar .btn {
  height: 30px !important;
  line-height: 1 !important;
  padding: 0 10px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  font-size: 0.825rem !important;
  box-sizing: border-box !important;
  margin: 0 !important;
  vertical-align: middle !important;
  white-space: nowrap !important;
}
.action-bar .btn-icon-only {
  width: 30px !important;
  padding: 0 !important;
}
.action-bar .btn .bi {
  font-size: 13px !important;
  line-height: 1 !important;
  display: inline-block !important;
  vertical-align: middle !important;
}
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <!-- Mobile topbar -->
  <nav class="navbar navbar-dark bg-dark d-md-none">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand"><i class="bi bi-rocket-takeoff me-1"></i>JHTracker</span>
    </div>
  </nav>

  <!-- Sidebar (desktop) -->
  <div class="col-md-2 sidebar p-3 d-none d-md-block">
    {% include '_sidebar.html' %}
  </div>

  <!-- Sidebar (mobile offcanvas) -->
  <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="sidebarOffcanvas">
    <div class="offcanvas-body">
      {% include '_sidebar.html' %}
    </div>
  </div>

  <!-- Main -->
  <div class="col-md-10 p-4">
    {% block content %}{% endblock %}
  </div>
</div>
</div>

<!-- SSE Toast Alert for Agent Data Updates -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
  <div id="agentDataToast" class="toast align-items-center text-bg-info border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi bi-robot me-2"></i>智能体已在后台更新了数据，点击 <a href="javascript:location.reload()" class="text-white fw-bold text-decoration-underline">刷新页面</a> 查看最新内容。
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/js/bootstrap.bundle.min.js') }}"></script>
<script>
if (!!window.EventSource) {
  const source = new EventSource('/api/stream');
  let firstConnect = true;
  source.onmessage = function(e) {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'db_updated') {
        if (!firstConnect) {
          const toastEl = document.getElementById('agentDataToast');
          if (toastEl) {
            const toast = new bootstrap.Toast(toastEl, { delay: 10000 });
            toast.show();
          }
        }
      }
    } catch(err){}
    firstConnect = false;
  };
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
