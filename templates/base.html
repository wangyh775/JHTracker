<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark" x-data="{ theme: localStorage.getItem('jhtracker-theme') || 'dark' }" x-effect="document.documentElement.setAttribute('data-bs-theme', theme); localStorage.setItem('jhtracker-theme', theme)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JHTracker — 求职全流程管理</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link href="{{ url_for('static', filename='vendor/css/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/css/bootstrap-icons.css') }}" rel="stylesheet">
<script>
(function(){var t=localStorage.getItem('jhtracker-theme')||'dark';document.documentElement.setAttribute('data-bs-theme',t);})();
</script>
<script src="{{ url_for('static', filename='vendor/js/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/js/htmx.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='vendor/js/alpine.min.js') }}"></script>
<style>
:root {
  --bg-primary: #09090b;
  --bg-card: #18181b;
  --bg-card-hover: #27272a;
  --border: #27272a;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.6);
  --radius: 10px;
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
[data-bs-theme="light"] {
  --bg-primary: #ffffff;
  --bg-card: #f4f4f5;
  --bg-card-hover: #e4e4e7;
  --border: #e4e4e7;
  --border-subtle: rgba(0, 0, 0, 0.08);
  --text-primary: #09090b;
  --text-secondary: #52525b;
  --text-muted: #a1a1aa;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
}
[data-bs-theme="light"] body {
  background: var(--bg-primary);
  color: var(--text-primary);
}
[data-bs-theme="light"] .sidebar {
  background: var(--bg-card);
  border-right: 1px solid var(--border);
}
[data-bs-theme="light"] .sidebar .nav-link {
  color: var(--text-secondary);
}
[data-bs-theme="light"] .sidebar .nav-link:hover {
  color: var(--text-primary);
  background: var(--bg-card-hover);
}
[data-bs-theme="light"] .sidebar .nav-link.active {
  color: #fff;
}
[data-bs-theme="light"] .stat-card .num { color: var(--text-primary); }
[data-bs-theme="light"] .card, [data-bs-theme="light"] .modal-content {
  background: #ffffff;
  border-color: var(--border);
}
[data-bs-theme="light"] .card:hover { border-color: #d4d4d8; }
[data-bs-theme="light"] .table { color: var(--text-primary); }
[data-bs-theme="light"] .table-hover tbody tr:hover {
  color: var(--text-primary);
  background: var(--bg-card-hover);
}
[data-bs-theme="light"] .form-control, [data-bs-theme="light"] .form-select {
  background: #ffffff;
  border-color: var(--border);
  color: var(--text-primary);
}
[data-bs-theme="light"] .form-control:focus, [data-bs-theme="light"] .form-select:focus {
  background: #ffffff;
  color: var(--text-primary);
  border-color: var(--accent);
}
[data-bs-theme="light"] .btn-outline-light {
  color: var(--text-secondary);
  border-color: var(--border);
}
[data-bs-theme="light"] .btn-outline-light:hover {
  color: var(--text-primary);
  background: var(--bg-card-hover);
  border-color: var(--border);
}
[data-bs-theme="light"] .bg-dark {
  background: var(--bg-card) !important;
}
[data-bs-theme="light"] .text-light {
  color: var(--text-primary) !important;
}
[data-bs-theme="light"] .text-secondary {
  color: var(--text-secondary) !important;
}
[data-bs-theme="light"] .text-muted {
  color: var(--text-muted) !important;
}
[data-bs-theme="light"] .bg-dark-subtle {
  background: var(--bg-card) !important;
}
[data-bs-theme="light"] .list-group-item {
  background: transparent !important;
}
[data-bs-theme="light"] .funnel-bar-wrap { background: #e4e4e7; }
[data-bs-theme="light"] .urgent-banner {
  background: linear-gradient(90deg, rgba(220,53,69,0.08), rgba(255,193,7,0.08));
  border-color: rgba(220,53,69,0.2);
}
[data-bs-theme="light"] .offcanvas {
  background: #ffffff !important;
}
[data-bs-theme="light"] .navbar {
  background: var(--bg-card) !important;
}
[data-bs-theme="light"] .bg-zinc-900 {
  background: var(--bg-card) !important;
}
[data-bs-theme="light"] .border-zinc-800 {
  border-color: var(--border) !important;
}
[data-bs-theme="light"] .bg-zinc-800 {
  background: var(--bg-card-hover) !important;
}
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
}
.sidebar {
  background: var(--bg-card);
  min-height: 100vh;
  border-right: 1px solid var(--border);
}
.sidebar .nav-link {
  color: var(--text-secondary);
  padding: 0.6rem 1rem;
  border-radius: 6px;
  margin: 2px 0;
  transition: var(--transition);
  position: relative;
  font-weight: 500;
}
.sidebar .nav-link:hover {
  color: #fff;
  background: #27272a;
}
.sidebar .nav-link.active {
  color: #fff;
  background: var(--accent);
}
.sidebar .nav-link.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 60%;
  background: #fff;
  border-radius: 2px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  transition: var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-hover); border-color: #3f3f46; }
.stat-card .num { font-size: 2rem; font-weight: 700; color: #fff; }
.badge-priority-S { background: #ef4444; color: #fff; }
.badge-priority-A { background: #f59e0b; color: #000; }
.badge-priority-B { background: #3b82f6; color: #fff; }
.badge-priority-C { background: #6b7280; color: #fff; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.funnel-bar { height: 24px; border-radius: 4px; margin: 2px 0; transition: width 0.3s; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: var(--transition);
}
.card:hover { border-color: #3f3f46; }
.modal-content { background: var(--bg-card); border: 1px solid var(--border); }
.table { color: var(--text-primary); }
.table-hover tbody tr {
  transition: var(--transition);
  position: relative;
}
.table-hover tbody tr:hover {
  color: #fff;
  background: var(--bg-card-hover);
  box-shadow: inset 3px 0 0 var(--accent);
}
.form-control, .form-select {
  background: #18181b;
  border: 1px solid var(--border);
  color: var(--text-primary);
  transition: var(--transition);
  border-radius: 6px;
}
.form-control:focus, .form-select:focus {
  background: #18181b;
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
}
.btn { transition: var(--transition); border-radius: 6px; }
.btn-outline-light:hover { color: #000; }
.badge { border-radius: 6px; padding: 0.4em 0.7em; font-weight: 500; }
a { color: #818cf8; transition: var(--transition); }
a:hover { color: #a5b4fc; }
.dashboard-title { font-size: 1.5rem; font-weight: 600; }
.funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.funnel-label { width: 80px; text-align: right; font-size: 0.85rem; flex-shrink: 0; }
.funnel-bar-wrap { flex: 1; background: #222; border-radius: 4px; overflow: hidden; }
.funnel-bar-fill { height: 22px; border-radius: 4px; }
.funnel-count { width: 40px; text-align: right; font-size: 0.85rem; flex-shrink: 0; }
.bi { font-size: 14px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
.urgent-banner {
  background: linear-gradient(90deg, rgba(220,53,69,0.15), rgba(255,193,7,0.15));
  border: 1px solid rgba(220,53,69,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
}
/* 统一操作按钮栏 */
.action-bar {
  display: inline-flex !important;
  align-items: center !important;
  gap: 6px !important;
  vertical-align: middle !important;
}
.action-bar form {
  display: inline-flex !important;
  align-items: center !important;
  margin: 0 !important;
  padding: 0 !important;
}
.action-bar .btn {
  height: 30px !important;
  line-height: 1 !important;
  padding: 0 10px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  font-size: 0.825rem !important;
  box-sizing: border-box !important;
  margin: 0 !important;
  vertical-align: middle !important;
  white-space: nowrap !important;
}
.action-bar .btn-icon-only {
  width: 30px !important;
  padding: 0 !important;
}
.action-bar .btn .bi {
  font-size: 13px !important;
  line-height: 1 !important;
  display: inline-block !important;
  vertical-align: middle !important;
}
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <!-- Mobile topbar -->
  <nav class="navbar navbar-dark bg-dark d-md-none">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand"><i class="bi bi-rocket-takeoff me-1"></i>JHTracker</span>
    </div>
  </nav>

  <!-- Sidebar (desktop) -->
  <div class="col-md-2 sidebar p-3 d-none d-md-block">
    {% include '_sidebar.html' %}
  </div>

  <!-- Sidebar (mobile offcanvas) -->
  <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="sidebarOffcanvas">
    <div class="offcanvas-body">
      {% include '_sidebar.html' %}
    </div>
  </div>

  <!-- Main -->
  <div class="col-md-10 p-4">
    {% block content %}{% endblock %}
  </div>
</div>
</div>

<!-- SSE Toast Alert for Agent Data Updates -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
  <div id="agentDataToast" class="toast align-items-center text-bg-info border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi bi-robot me-2"></i>智能体已在后台更新了数据，点击 <a href="javascript:location.reload()" class="text-white fw-bold text-decoration-underline">刷新页面</a> 查看最新内容。
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/js/bootstrap.bundle.min.js') }}"></script>
<script>
if (!!window.EventSource) {
  const source = new EventSource('/api/stream');
  let firstConnect = true;
  source.onmessage = function(e) {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'db_updated') {
        if (!firstConnect) {
          const toastEl = document.getElementById('agentDataToast');
          if (toastEl) {
            const toast = new bootstrap.Toast(toastEl, { delay: 10000 });
            toast.show();
          }
        }
      }
    } catch(err){}
    firstConnect = false;
  };
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
