{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div class="dashboard-title"><i class="bi bi-calendar3 me-2 text-primary"></i>时间线</div>
  <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg me-1"></i>添加节点</button>
</div>

<div class="card">
  <div class="card-body" style="overflow-x: auto;">
    <div class="d-flex gap-4" style="min-width: 900px; padding: 10px 0;">
      <div class="position-relative d-flex" style="gap: 0;">
        {% for item in items %}
        <div class="text-center position-relative" style="min-width: 150px; max-width: 180px; flex-shrink: 0;">
          <!-- 圆点连线 -->
          <div style="position: relative; height: 30px;">
            {% if not loop.first %}
            <div style="position: absolute; top: 14px; left: -50%; width: 100%; height: 3px; background: #444; z-index: 0;"></div>
            {% endif %}
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                        width: 18px; height: 18px; border-radius: 50%; z-index: 1;
                        {% if item.done %}background: #198754; border: 3px solid #198754;
                        {% elif item.event_type == 'deadline' %}background: #dc3545; border: 3px solid #dc3545;
                        {% elif item.event_type == 'milestone' %}background: #ffc107; border: 3px solid #ffc107;
                        {% else %}background: #0d6efd; border: 3px solid #0d6efd;{% endif %}"></div>
          </div>
          <!-- 日期 -->
          <div class="small fw-bold mb-1 {% if item.event_date < now().date() %}text-secondary{% else %}text-info{% endif %}">
            {{ item.event_date.strftime('%m/%d') }}
          </div>
          <!-- 标题 -->
          <div class="small px-1 {% if item.done %}text-decoration-line-through text-secondary{% endif %}"
               style="min-height: 55px;">
            <span class="badge {% if item.event_type=='deadline' %}bg-danger{% elif item.event_type=='milestone' %}bg-warning text-dark{% else %}bg-primary{% endif %} mb-1" style="font-size: 0.65rem;">
              {{ item.event_type }}
            </span>
            <br>
            <span class="fw-bold">{{ item.title }}</span>
          </div>
          <!-- 描述 -->
          <div class="small text-secondary mb-1" style="font-size: 0.7rem; min-height: 25px;">
            {{ item.description or '' }}
          </div>
          <!-- 完成按钮 -->
          <form method="post" action="/timeline/{{ item.id }}/toggle" class="m-0">
            <button class="btn btn-sm btn-link p-0 text-decoration-none {% if item.done %}text-success{% else %}text-secondary{% endif %}">
              {% if item.done %}<i class="bi bi-check-circle-fill"></i> 已完成{% else %}<i class="bi bi-circle"></i> 标记完成{% endif %}
            </button>
          </form>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% if not items %}
<div class="text-center text-secondary py-5">
  <i class="bi bi-calendar-x fs-1"></i><br>暂无时间节点，请先<a href="/import">导入时间线</a>
</div>
{% endif %}

<!-- Add Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/timeline/add">
        <div class="modal-header"><h5 class="modal-title">添加节点</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">日期 *</label><input type="date" class="form-control" name="event_date" required></div>
          <div class="mb-3"><label class="form-label">类型</label>
            <select class="form-select" name="event_type">
              <option value="action">行动项 (Action)</option>
              <option value="deadline">截止日 (Deadline)</option>
              <option value="milestone">里程碑 (Milestone)</option>
              <option value="reminder">提醒 (Reminder)</option>
            </select>
          </div>
          <div class="mb-3"><label class="form-label">标题 *</label><input class="form-control" name="title" required></div>
          <div class="mb-3"><label class="form-label">描述</label><textarea class="form-control" name="description" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary">保存</button></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
