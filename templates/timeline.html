{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div class="dashboard-title"><i class="bi bi-calendar3 me-2 text-primary"></i>时间线（甘特图）</div>
  <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg me-1"></i>添加节点</button>
</div>

<!-- 过滤控制开关 -->
<div class="d-flex gap-3 mb-3 flex-wrap">
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" id="showCompleted" checked onchange="renderGantt()">
    <label class="form-check-label small" for="showCompleted">显示已完成</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" id="showExpired" checked onchange="renderGantt()">
    <label class="form-check-label small" for="showExpired">显示已过期</label>
  </div>
</div>

<!-- 甘特图 -->
<div class="card mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="card-title mb-0"><i class="bi bi-bar-chart-steps me-2"></i>时间甘特图</h6>
      <div class="btn-group btn-group-sm" role="group" id="rangeSwitch">
        <button type="button" class="btn btn-outline-secondary" data-range="month">近1月</button>
        <button type="button" class="btn btn-outline-secondary" data-range="quarter">近3月</button>
        <button type="button" class="btn btn-outline-secondary" data-range="season">秋招季</button>
        <button type="button" class="btn btn-outline-secondary" data-range="all">全部</button>
      </div>
    </div>
    <div style="height: 400px;">
      <canvas id="ganttChart"></canvas>
    </div>
  </div>
</div>

<!-- 列表详情（微卡片样式） -->
<div class="card">
  <div class="card-body">
    <h6 class="card-title mb-3"><i class="bi bi-list-ul me-2"></i>节点详情</h6>
    <div class="d-flex flex-column gap-2" id="timelineCardList">
      <div class="text-center text-secondary py-4" id="emptyTimelineMessage">
        <i class="bi bi-calendar-x fs-1"></i><br>暂无活动节点，勾选上方「显示已完成/已过期」可查看历史节点
      </div>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="/timeline/add">
        <div class="modal-header"><h5 class="modal-title">添加节点</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">开始日期 *</label><input type="date" class="form-control" name="event_date" required></div>
          <div class="mb-3"><label class="form-label">结束日期（可选，默认同开始）</label><input type="date" class="form-control" name="end_date"></div>
          <div class="mb-3"><label class="form-label">类型</label>
            <select class="form-select" name="event_type">
              <option value="action">行动项 (Action)</option>
              <option value="deadline">截止日 (Deadline)</option>
              <option value="milestone">里程碑 (Milestone)</option>
              <option value="reminder">提醒 (Reminder)</option>
            </select>
          </div>
          <div class="mb-3"><label class="form-label">标题 *</label><input class="form-control" name="title" required></div>
          <div class="mb-3"><label class="form-label">描述</label><textarea class="form-control" name="description" rows="3"></textarea></div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary">保存</button></div>
      </form>
    </div>
  </div>
</div>

<!-- View/Edit Modal（点击节点弹出，支持查看与编辑切换） -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <!-- 查看模式 -->
      <div id="viewPane">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-calendar3 me-2"></i><span id="viewTitle"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <span class="badge me-2" id="viewTypeBadge"></span>
            <span class="text-secondary small" id="viewDateRange"></span>
            <span class="badge bg-success ms-2" id="viewDoneBadge" style="display:none;">已完成</span>
          </div>
          <hr>
          <div id="viewDescription" style="white-space: pre-wrap; word-wrap: break-word; line-height: 1.7;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
          <button type="button" class="btn btn-primary" onclick="switchToEdit()"><i class="bi bi-pencil me-1"></i>编辑</button>
        </div>
      </div>

      <!-- 编辑模式 -->
      <div id="editPane" style="display:none;">
        <form method="post" action="" id="editForm">
          <div class="modal-header"><h5 class="modal-title"><i class="bi bi-pencil me-2"></i>编辑节点</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">开始日期 *</label><input type="date" class="form-control" name="event_date" id="editEventDate" required></div>
            <div class="mb-3"><label class="form-label">结束日期</label><input type="date" class="form-control" name="end_date" id="editEndDate"></div>
            <div class="mb-3"><label class="form-label">类型</label>
              <select class="form-select" name="event_type" id="editEventType">
                <option value="action">行动项 (Action)</option>
                <option value="deadline">截止日 (Deadline)</option>
                <option value="milestone">里程碑 (Milestone)</option>
                <option value="reminder">提醒 (Reminder)</option>
              </select>
            </div>
            <div class="mb-3"><label class="form-label">标题 *</label><input class="form-control" name="title" id="editTitle" required></div>
            <div class="mb-3"><label class="form-label">描述</label><textarea class="form-control" name="description" id="editDescription" rows="3"></textarea></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" onclick="switchToView()">取消</button>
            <button class="btn btn-primary">保存修改</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/js/chartjs-adapter-date-fns.bundle.min.js') }}"></script>
<script>
const items = [
  {% for item in items %}
  {
    id: {{ item.id }},
    title: {{ item.title|tojson }},
    start: {{ item.event_date.strftime('%Y-%m-%d')|tojson }},
    end: {{ (item.end_date or item.event_date).strftime('%Y-%m-%d')|tojson }},
    type: {{ item.event_type|tojson }},
    done: {{ item.done|tojson }},
    description: {{ (item.description or '')|tojson }},
  }{% if not loop.last %},{% endif %}
  {% endfor %}
];

function toTs(s) { return new Date(s).getTime(); }
const ONE_DAY = 86400000;
const todayStr = new Date().toISOString().split('T')[0];

function colorFor(item) {
  if (item.done) return 'rgba(25,135,84,0.85)';
  if (item.type === 'deadline') return '#ef4444';
  if (item.type === 'milestone') return '#f59e0b';
  if (item.type === 'reminder') return '#8a94a6';
  return '#6366f1';
}

const TYPE_LABELS = {
  'action': '行动项',
  'deadline': '截止日',
  'milestone': '里程碑',
  'reminder': '提醒'
};
const TYPE_BADGE_CLASSES = {
  'deadline': 'bg-danger',
  'milestone': 'bg-warning text-dark',
  'reminder': 'bg-secondary',
  'action': 'bg-primary'
};

let currentRangeKind = 'month';
let chart = null;

function filterItems() {
  const showCompleted = document.getElementById('showCompleted').checked;
  const showExpired = document.getElementById('showExpired').checked;

  return items.filter(i => {
    if (!showCompleted && i.done) return false;
    if (!showExpired && i.end < todayStr) return false;
    return true;
  });
}

function renderCardList(filtered) {
  const container = document.getElementById('timelineCardList');
  if (!container) return;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="text-center text-secondary py-4">
        <i class="bi bi-calendar-x fs-1"></i><br>暂无活动节点，勾选上方「显示已完成/已过期」可查看历史节点
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(item => `
    <div class="p-3 rounded bg-zinc-900 border border-zinc-800 timeline-card ${item.done ? 'opacity-50' : ''}" style="cursor:pointer;" data-id="${item.id}">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <span class="badge ${TYPE_BADGE_CLASSES[item.type] || 'bg-primary'}">${TYPE_LABELS[item.type] || item.type}</span>
          <strong class="text-light fs-6">${item.title}</strong>
          ${item.done ? '<span class="badge bg-success ms-1"><i class="bi bi-check-circle-fill me-1"></i>已完成</span>' : ''}
          ${(!item.done && item.end < todayStr) ? '<span class="badge bg-danger ms-1">已过期</span>' : ''}
        </div>
        <div class="d-flex align-items-center gap-3">
          <span class="text-secondary small">
            <i class="bi bi-clock me-1"></i>${item.start}${item.end && item.end !== item.start ? ' ~ ' + item.end : ''}
          </span>
          <div onclick="event.stopPropagation();">
            <form method="post" action="/timeline/${item.id}/toggle">
              <button class="btn btn-sm ${item.done ? 'btn-success' : 'btn-outline-success'} py-0 px-2">
                ${item.done ? '<i class="bi bi-check-circle-fill"></i> 已完成' : '<i class="bi bi-circle"></i> 标记完成'}
              </button>
            </form>
          </div>
        </div>
      </div>
      ${item.description ? `<div class="small text-secondary mt-2 border-top border-zinc-800 pt-2">${item.description}</div>` : ''}
    </div>
  `).join('');
}

function renderGantt() {
  const filtered = filterItems();
  renderCardList(filtered);

  const chartData = filtered.map(i => {
    const s = toTs(i.start);
    const e = toTs(i.end);
    return e > s ? [s, e] : [s, s + ONE_DAY * 3];
  });

  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  let xmin, xmax, unit;

  if (currentRangeKind === 'month') {
    xmin = new Date(y, m, 1).getTime();
    xmax = new Date(y, m + 1, 0, 23, 59, 59).getTime() + ONE_DAY * 30;
    unit = 'day';
  } else if (currentRangeKind === 'quarter') {
    xmin = new Date(y, m - 1, 1).getTime();
    xmax = new Date(y, m + 2, 0, 23, 59, 59).getTime();
    unit = 'week';
  } else if (currentRangeKind === 'season') {
    xmin = new Date(2026, 6, 1).getTime();
    xmax = new Date(2026, 11, 31, 23, 59, 59).getTime();
    unit = 'month';
  } else {
    xmin = chartData.length ? Math.min(...chartData.map(d => d[0])) : new Date().getTime();
    xmax = chartData.length ? Math.max(...chartData.map(d => d[1])) : new Date().getTime() + ONE_DAY * 30;
    unit = 'month';
  }

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('ganttChart'), {
    type: 'bar',
    data: {
      labels: filtered.map(i => i.title),
      datasets: [{
        data: chartData,
        backgroundColor: filtered.map(i => colorFor(i)),
        borderColor: filtered.map(i => colorFor(i)),
        borderWidth: 1,
        barPercentage: 0.6,
        categoryPercentage: 0.8,
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
          min: xmin,
          max: xmax,
          time: {
            unit: unit,
            displayFormats: { day: 'yyyy-MM-dd', week: 'yyyy-MM-dd', month: 'yyyy-MM' },
            stepSize: unit === 'day' ? 3 : 1,
          },
          ticks: { color: '#a1a1aa', autoSkip: true, maxRotation: 0, maxTicksLimit: 12, font: { size: 11 } },
          grid: { color: '#27272a' }
        },
        y: {
          ticks: { color: '#f4f4f5', font: { size: 12 }, callback: function(v) { const l = this.getLabelForValue(v); return l.length > 18 ? l.substring(0, 18) + '…' : l; } },
          grid: { color: '#18181b' }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#18181b',
          borderColor: '#27272a',
          borderWidth: 1,
          padding: 10,
          titleColor: '#f4f4f5',
          bodyColor: '#a1a1aa',
          callbacks: { label: (ctx) => { const i = filtered[ctx.dataIndex]; return i.description || `${i.start} ~ ${i.end}`; } }
        }
      },
      onClick: (e, els) => {
        if (els.length > 0) {
          const idx = els[0].index;
          const i = filtered[idx];
          openTimelineModal(i.id, i.start, i.end, i.type, i.title, i.description, i.done);
        }
      }
    }
  });
}

const defaultBtn = document.querySelector('#rangeSwitch [data-range="month"]');
if (defaultBtn) defaultBtn.classList.add('active');
renderGantt();

document.querySelectorAll('#rangeSwitch [data-range]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#rangeSwitch [data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRangeKind = btn.dataset.range;
    renderGantt();
  });
});

// 类型标签映射
const TYPE_LABELS = {
  'action': '行动项',
  'deadline': '截止日',
  'milestone': '里程碑',
  'reminder': '提醒'
};
const TYPE_BADGE_CLASSES = {
  'deadline': 'bg-danger',
  'milestone': 'bg-warning text-dark',
  'reminder': 'bg-secondary',
  'action': 'bg-primary'
};

// 点击节点/列表项：默认进入查看模式
function openTimelineModal(id, eventDate, endDate, eventType, title, description, done) {
  // 填充查看模式
  document.getElementById('viewTitle').textContent = title;
  const badge = document.getElementById('viewTypeBadge');
  badge.textContent = TYPE_LABELS[eventType] || eventType;
  badge.className = 'badge me-2 ' + (TYPE_BADGE_CLASSES[eventType] || 'bg-primary');
  const dateStr = (eventDate === endDate) ? eventDate : eventDate + ' ~ ' + endDate;
  document.getElementById('viewDateRange').textContent = dateStr;
  document.getElementById('viewDoneBadge').style.display = done ? '' : 'none';
  document.getElementById('viewDescription').textContent = description || '（无描述）';
  // 同时填充编辑模式
  document.getElementById('editForm').action = '/timeline/' + id + '/edit';
  document.getElementById('editEventDate').value = eventDate;
  document.getElementById('editEndDate').value = endDate;
  document.getElementById('editEventType').value = eventType;
  document.getElementById('editTitle').value = title;
  document.getElementById('editDescription').value = description;
  // 默认显示查看模式
  switchToView();
  new bootstrap.Modal(document.getElementById('editModal')).show();
}

// 绑定列表项点击事件（事件代理：从内存 items 查找，避免字符串转义/换行导致 JS 语法错误）
document.getElementById('timelineCardList')?.addEventListener('click', (e) => {
  const card = e.target.closest('.timeline-card');
  if (!card) return;
  const id = parseInt(card.dataset.id, 10);
  const targetItem = items.find(i => i.id === id);
  if (targetItem) {
    openTimelineModal(targetItem.id, targetItem.start, targetItem.end, targetItem.type, targetItem.title, targetItem.description, targetItem.done);
  }
});

// 切换到查看模式
function switchToView() {
  document.getElementById('viewPane').style.display = '';
  document.getElementById('editPane').style.display = 'none';
}

// 切换到编辑模式
function switchToEdit() {
  document.getElementById('viewPane').style.display = 'none';
  document.getElementById('editPane').style.display = '';
}
</script>
{% endblock %}
