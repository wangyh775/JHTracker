{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <a href="/study" class="text-decoration-none text-secondary me-2"><i class="bi bi-arrow-left"></i>返回</a>
    <span class="dashboard-title">{{ material.title }}</span>
    <span class="badge bg-secondary ms-2">{{ material.category }}</span>
  </div>
</div>

<div class="card">
  <div class="card-body p-4" style="line-height: 1.8;">
    <div id="content" class="text-white"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const content = {{ content | tojson }};

// 如果打开的是面试复习手册，跳到对应章节
{% if '面试复习手册' in material.source_file %}
const sections = {
  'control': '自动控制原理',
  'mechanical': '机械设计基础',
  'sensor': '传感器与检测技术',
  'motor': '电机与运动控制',
  'embedded': '嵌入式与编程',
  'plc': 'PLC与工业网络',
  'thermal': '热工基础',
  'behavior': '面试行为问题'
};
const sectionTitle = sections['{{ material.category }}'];
const idx = content.indexOf('## ' + sectionTitle);
if (idx > 0) {
  document.getElementById('content').innerHTML = marked.parse(content.substring(idx));
} else {
  document.getElementById('content').innerHTML = marked.parse(content);
}
{% else %}
document.getElementById('content').innerHTML = marked.parse(content);
{% endif %}
</script>
{% endblock %}
