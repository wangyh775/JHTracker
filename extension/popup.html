<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Career Tracker Copilot</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #2563eb;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border-radius: 9999px;
      font-size: 10px;
      margin-top: 10px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }
    .btn-link {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px 0;
      background: #1e293b;
      border: 1px solid #334155;
      color: #93c5fd;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      margin-top: 12px;
      box-sizing: border-box;
    }
    .btn-link:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">CT</div>
    <div>
      <div style="font-weight: bold; color: #fff;">Career Tracker Copilot</div>
      <div style="color: #94a3b8; font-size: 10px;">网申副驾驶插件已就绪</div>
    </div>
  </div>

  <div class="status-badge">
    <div class="status-dot"></div>
    <span>已就绪 • 支持所有校招网申系统</span>
  </div>

  <div style="color: #94a3b8; font-size: 11px; margin-top: 10px; line-height: 1.4;">
    打开任意校招页面（北森、飞书招聘、Moka、Boss直聘），右下角会自动弹出 <strong>【⚡ 网申助手】</strong> 悬浮胶囊。
  </div>

  <a href="http://localhost:8000" target="_blank" class="btn-link">
    打开求职工作台 (Web) ↗
  </a>
</body>
</html>
