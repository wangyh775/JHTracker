<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JHTracker Human-in-the-loop Adaptive Recommendation and Dual Recall Loop">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="hitlCenterGlow2" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#080b11" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="hitlGrid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Center Engine Border Gradient -->
    <linearGradient id="engineBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Crisp Marker Arrows -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#a855f7" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#10b981" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#f43f5e" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- ════════════════ BACKGROUND BASE ════════════════ -->
  <rect width="1200" height="640" fill="#080b11"/>
  <rect width="1200" height="640" fill="url(#hitlGrid2)"/>
  <circle cx="600" cy="300" r="380" fill="url(#hitlCenterGlow2)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="600" rx="16" fill="#0b0f17" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2"/>

  <!-- ════════════════ TOP TITLE HEADER ════════════════ -->
  <g transform="translate(45, 46)">
    <rect x="0" y="0" width="175" height="22" rx="11" fill="#06281e" stroke="#059669" stroke-width="1"/>
    <text x="87" y="15" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="1.5">HITL ADAPTIVE LOOP</text>
    <text x="195" y="16" font-family="Inter, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">
      Dual-Channel Recall + Dynamic Weight Reinforcement &amp; Safety Decay
    </text>
    <text x="1115" y="15" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Human Decision in Full Control</text>
  </g>

  <!-- ════════════════ STAGE 1: DUAL INPUTS & MATRIX (Left) ════════════════ -->
  <!-- Box 1: Public Jobs Pool -->
  <g transform="translate(45, 88)">
    <rect x="0" y="0" width="265" height="95" rx="10" fill="#101725" stroke="#0ea5e9" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="28" rx="10" fill="#16253b"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
    <text x="28" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">🌐 24,000+ Public Jobs Pool</text>
    <text x="16" y="47" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• SQLite FTS5 Inverted Index (<tspan fill="#38bdf8">&lt;50ms</tspan>)</text>
    <text x="16" y="66" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• SHA-256 deduplicated ingestion</text>
    <text x="16" y="85" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">data/public_jobs.db</text>
  </g>

  <!-- Box 2: User Resume Profile -->
  <g transform="translate(45, 202)">
    <rect x="0" y="0" width="265" height="95" rx="10" fill="#101725" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="0" y="0" width="265" height="28" rx="10" fill="#241b38"/>
    <circle cx="16" cy="14" r="4" fill="#a855f7"/>
    <text x="28" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#c084fc">👤 Active User Profile</text>
    <text x="16" y="47" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Extracted Hard &amp; Soft Skills</text>
    <text x="16" y="66" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Target cities, salary, degree anchor</text>
    <text x="16" y="85" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">Read-only Master Resume</text>
  </g>

  <!-- Box 3: HITL Dynamic Preference Matrix -->
  <g transform="translate(45, 430)">
    <rect x="0" y="0" width="265" height="145" rx="10" fill="#091c17" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="28" rx="10" fill="#0f3328"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#34d399">⚡ HITL Preference Matrix</text>
    <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">~/.JHTracker/user_data.db</text>
    <text x="16" y="70" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Category Weights: <tspan fill="#34d399" font-weight="bold">0.05 ~ 1.50</tspan></text>
    <text x="16" y="91" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• Industry Weights: <tspan fill="#38bdf8" font-weight="bold">0.05 ~ 1.50</tspan></text>
    <text x="16" y="112" font-family="Inter, sans-serif" font-size="11.5" fill="#cbd5e1">• City Weights: <tspan fill="#c084fc" font-weight="bold">0.05 ~ 1.50</tspan></text>
    <text x="16" y="133" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7">Real-time feedback convergence</text>
  </g>

  <!-- Clean Input Connectors into Engine (NO SHADOWS, CRISP ARROWS) -->
  <path d="M 310,135 L 360,135" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <path d="M 310,249 L 360,249" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <path d="M 177,430 L 177,340 L 360,340" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)"/>

  <!-- ════════════════ STAGE 2: ADAPTIVE ENGINE CORE (Center) ════════════════ -->
  <g transform="translate(365, 88)">
    <rect x="0" y="0" width="310" height="305" rx="14" fill="#0f1420" stroke="url(#engineBorder)" stroke-width="1.8"/>
    <rect x="0" y="0" width="310" height="36" rx="14" fill="#161f30"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🧠 Dual-Channel Adaptive Engine</text>

    <!-- Sub-block 1: Dual Recall -->
    <rect x="15" y="50" width="280" height="60" rx="8" fill="#141c2b" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="72" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">1. Dual-Channel Parallel Recall</text>
    <text x="28" y="94" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Branch A: Skill FTS5 · Branch B: 24h Fresh JDs</text>

    <!-- Sub-block 2: Dynamic Hybrid Score -->
    <rect x="15" y="122" width="280" height="88" rx="8" fill="#141c2b" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="144" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">2. Dynamic Weighted Hybrid Score</text>
    <text x="28" y="164" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fde68a">Score = 0.50 × S_skill</text>
    <text x="80" y="180" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">+ 0.30 × S_hitl</text>
    <text x="80" y="196" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#93c5fd">+ 0.20 × S_freshness</text>

    <!-- Sub-block 3: Anti-Flood -->
    <rect x="15" y="222" width="280" height="68" rx="8" fill="#141c2b" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="244" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#f43f5e">3. Anti-Flood &amp; Noise Capping</text>
    <text x="28" y="264" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Max 3 jobs/company · Min Score ≥ 0.40</text>
    <text x="28" y="278" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Excludes already-applied positions</text>
  </g>

  <!-- Flow to Stage 3 (Clean Vector Line, NO SHADOW) -->
  <path d="M 675,240 L 725,240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- ════════════════ STAGE 3: DELIVERY (Top Matches) ════════════════ -->
  <g transform="translate(735, 135)">
    <rect x="0" y="0" width="170" height="205" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="28" rx="12" fill="#291b08"/>
    <text x="15" y="19" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">🎯 Top Matches</text>

    <text x="14" y="52" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">• Fit score percentage</text>
    <text x="14" y="74" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">• Missing skills radar</text>
    <text x="14" y="96" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">• Collapsible JD preview</text>
    <text x="14" y="118" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">• 1-click apply portal</text>

    <line x1="12" y1="135" x2="158" y2="135" stroke="#1f2937"/>
    <text x="14" y="156" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Pushed to:</text>
    <text x="14" y="174" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">▶ Web UI (75% view)</text>
    <text x="14" y="192" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#a855f7">▶ MCP job_recommend</text>
  </g>

  <!-- Flow from Top Matches to Decision Cards (Clean Line) -->
  <path d="M 905,195 L 930,195" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <path d="M 905,285 L 930,285" fill="none" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#arrowRed)"/>

  <!-- ════════════════ STAGE 4: HUMAN DECISION CARDS ════════════════ -->
  <!-- ACCEPT CARD -->
  <g transform="translate(935, 145)">
    <rect x="0" y="0" width="215" height="102" rx="10" fill="#082017" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="18" cy="20" r="8" fill="#10b981"/>
    <text x="18" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">✓</text>
    <text x="34" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#34d399">ACCEPT (Interested)</text>
    <text x="14" y="52" font-family="Inter, sans-serif" font-size="11" fill="#a7f3d0">✓ Weights <tspan font-weight="bold" fill="#10b981">+15%</tspan> reinforcement</text>
    <text x="14" y="72" font-family="Inter, sans-serif" font-size="11" fill="#a7f3d0">✓ Auto pushed to Kanban:</text>
    <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#38bdf8">PENDING_APPLY</text>
  </g>

  <!-- REJECT CARD -->
  <g transform="translate(935, 260)">
    <rect x="0" y="0" width="215" height="102" rx="10" fill="#200d11" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="18" cy="20" r="8" fill="#f43f5e"/>
    <text x="18" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">✕</text>
    <text x="34" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#fda4af">REJECT (Dismiss)</text>
    <text x="14" y="52" font-family="Inter, sans-serif" font-size="11" fill="#fecdd3">✗ Weights <tspan font-weight="bold" fill="#f43f5e">×0.70</tspan> decay penalty</text>
    <text x="14" y="72" font-family="Inter, sans-serif" font-size="11" fill="#fecdd3">✗ Hard safety floor: <tspan font-weight="bold">0.05</tspan></text>
    <text x="14" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">✗ Blocked permanently</text>
  </g>

  <!-- ════════════════ FEEDBACK RETURN BUS (CRISP, NO SHADOW, CLEAN ORTHOGONAL) ════════════════ -->
  <!-- Accept Return Line: Clean Right-Angle Path -->
  <path id="flowAcceptPath" d="M 1042,247 L 1042,485 L 315,485" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGreen)"/>
  
  <!-- Reject Return Line: Clean Right-Angle Path -->
  <path id="flowRejectPath" d="M 1042,362 L 1042,535 L 315,535" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>

  <!-- Crisp Dynamic Motion Dots (NO BLUR, SHARP PARTICLES) -->
  <circle r="4" fill="#34d399">
    <animateMotion path="M 1042,247 L 1042,485 L 315,485" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#fb7185">
    <animateMotion path="M 1042,362 L 1042,535 L 315,535" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Descriptive Feedback Annotations along Return Bus -->
  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <rect x="520" y="470" width="395" height="22" rx="4" fill="#081813" stroke="#059669" stroke-width="0.8"/>
    <text x="530" y="485" fill="#34d399">HITL Positive Weight Reinforcement (+15%)</text>

    <rect x="440" y="520" width="475" height="22" rx="4" fill="#220b10" stroke="#e11d48" stroke-width="0.8"/>
    <text x="450" y="535" fill="#fda4af">HITL Negative Decay (×0.70, Min=0.05, Never Resurface)</text>
  </g>
</svg>
