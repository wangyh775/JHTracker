<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JHTracker Logo Evolution - Option B Series">
  <defs>
    <!-- Background Grid -->
    <pattern id="protoGridB" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Gradients for B1, B2, B3 -->
    <linearGradient id="cyberNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glassCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="ribbonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ribbonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="pulseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardDarkB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1526" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#080c16" stop-opacity="0.98"/>
    </linearGradient>

    <!-- High Tech Filters -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="700" fill="#06080e"/>
  <rect width="1200" height="700" fill="url(#protoGridB)"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="80" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">EVOLUTION B-SERIES</text>
    <text x="175" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">方案 B 深度科技重构：无限回环的高维演化</text>
    <text x="0" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">突破扁平线条，融入「粒子加速环、拓扑立体带、量化矩阵刻度」，打造国际顶尖级 AI 系统辨识度</text>
  </g>

  <!-- ════════ CARD 1: B1 (QUANTUM SYNAPSE / 量子粒子光轨) ════════ -->
  <g transform="translate(60, 126)" filter="url(#softCardShadow)">
    <rect width="340" height="520" rx="16" fill="url(#cardDarkB)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Top badge -->
    <rect x="16" y="16" width="92" height="22" rx="6" fill="#38bdf8" fill-opacity="0.18"/>
    <text x="62" y="31" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">B1 · 粒子加速</text>
    <text x="120" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">量子环流 · 粒子对撞</text>

    <!-- Canvas Box (180x180) -->
    <g transform="translate(80, 58)">
      <rect width="180" height="180" rx="32" fill="#080c16" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Deep Aura Glow -->
      <circle cx="90" cy="90" r="60" fill="#00f5ff" fill-opacity="0.06"/>
      <circle cx="90" cy="90" r="35" fill="#a855f7" fill-opacity="0.08"/>

      <!-- Ambient Tech Grids / Crosshairs in background of icon -->
      <line x1="90" y1="28" x2="90" y2="40" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="90" y1="140" x2="90" y2="152" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="28" y1="90" x2="40" y2="90" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="140" y1="90" x2="152" y2="90" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Outer High-Precision Dotted Orbit Halo -->
      <ellipse cx="90" cy="90" rx="72" ry="52" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- Main Möbius Stream: Left Cyan / Right Violet -->
      <!-- Left loop (Public Database Stream) -->
      <path d="M 90 90 C 72 56, 36 56, 36 90 C 36 124, 72 124, 90 90" fill="none" stroke="url(#cyberNeonGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#hyperGlow)"/>
      
      <!-- Right loop (Private User Loop) with Overlap Z-index effect -->
      <path d="M 90 90 C 108 124, 144 124, 144 90 C 144 56, 108 56, 90 90" fill="none" stroke="url(#ribbonGrad2)" stroke-width="6.5" stroke-linecap="round"/>

      <!-- Segmented Acceleration Pulses (Dash Overlay) -->
      <path d="M 90 90 C 72 56, 36 56, 36 90" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>
      <path d="M 144 90 C 144 56, 108 56, 90 90" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>

      <!-- Central HITL Quantum Core (Collision Event) -->
      <circle cx="90" cy="90" r="7" fill="#ffffff" filter="url(#hyperGlow)"/>
      <circle cx="90" cy="90" r="13" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

      <!-- J & H Monogram Nodes subtly embedded at apexes -->
      <!-- Left J Hook Dot -->
      <circle cx="48" cy="106" r="3" fill="#00f5ff"/>
      <!-- Right H Top Node -->
      <circle cx="132" cy="74" r="3" fill="#c084fc"/>
    </g>

    <!-- Description -->
    <g transform="translate(20, 260)">
      <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">【科技感升级亮点】</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
        <tspan x="0" dy="0">• <tspan font-weight="700" fill="#00f5ff">粒子加速光轨</tspan>：以双向流动的光束线条，</tspan>
        <tspan x="0" dy="18">  配合高亮脉冲断点，打破单调实心描边。</tspan>
        <tspan x="0" dy="24">• <tspan font-weight="700" fill="#ffffff">高能核心聚变点</tspan>：中心 HITL 网关不再是</tspan>
        <tspan x="0" dy="18">  死板实心点，而是带有扩散离子光环的光子核。</tspan>
        <tspan x="0" dy="24">• 宛如欧洲强子对撞机的微型量子拓扑，极致</tspan>
        <tspan x="0" dy="18">  硬核、神秘且具备超高算力暗示。</tspan>
      </text>

      <line x1="0" y1="130" x2="300" y2="130" stroke="#1e293b" stroke-width="1"/>

      <text x="0" y="152" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">【视觉气质】</text>
      <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
        <tspan x="0" dy="0">• 极客感：★★★★★  | 辨识度：★★★★☆</tspan>
        <tspan x="0" dy="18">• 极适合搭配 WebGL/Canvas 跑光微动效</tspan>
      </text>
    </g>
  </g>

  <!-- ════════ CARD 2: B2 (CYBER RIBBON 3D / 3D拓扑莫比乌斯缎带) ════════ -->
  <g transform="translate(430, 126)" filter="url(#softCardShadow)">
    <rect width="340" height="520" rx="16" fill="url(#cardDarkB)" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.8"/>
    <!-- Top badge -->
    <rect x="16" y="16" width="102" height="22" rx="6" fill="#a855f7" fill-opacity="0.22"/>
    <text x="67" y="31" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">B2 · 强烈推荐</text>
    <text x="130" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">立体拓扑 · 莫比乌斯缎带</text>

    <!-- Canvas Box (180x180) -->
    <g transform="translate(80, 58)">
      <rect width="180" height="180" rx="32" fill="#080c16" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="60" fill="#a855f7" fill-opacity="0.08"/>

      <!-- 3D Ribbon Layers (Simulating Isometric Depth with Overlapping Paths) -->
      <!-- Back Layer: Deep Violet/Indigo Underpass -->
      <path d="M 90 90 C 112 128, 148 128, 148 90 C 148 52, 112 52, 90 90" fill="none" stroke="url(#ribbonGrad2)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
      
      <!-- High-tech Ridge Line (Spine inside back layer) -->
      <path d="M 90 90 C 112 128, 148 128, 148 90 C 148 52, 112 52, 90 90" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8"/>

      <!-- Front Overlapping Layer: Crisp Cyan Ribbon with 3D Bevel Twist -->
      <path d="M 90 90 C 68 52, 32 52, 32 90 C 32 128, 68 128, 90 90" fill="none" stroke="url(#ribbonGrad1)" stroke-width="14" stroke-linecap="round" filter="url(#hyperGlow)"/>

      <!-- Spine Line for Front Ribbon (Data bus highway) -->
      <path d="M 90 90 C 68 52, 32 52, 32 90 C 32 128, 68 128, 90 90" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 3D Bridge Overpass Twist Cut (Optical illusion of loop crossing over) -->
      <path d="M 76 72 C 84 82, 96 98, 104 108" fill="none" stroke="#080c16" stroke-width="7"/>
      <path d="M 76 72 C 84 82, 96 98, 104 108" fill="none" stroke="url(#cyanNeonGrad)" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Subtle Cyber J and H Carved Monogram Accent -->
      <!-- Left side J tail accentuation -->
      <path d="M 46 64 L 46 94 C 46 104 38 108 32 108" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Right side H double post -->
      <line x1="134" y1="74" x2="134" y2="106" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="142" y1="74" x2="142" y2="106" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="134" y1="90" x2="142" y2="90" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Floating Radar Beacon in Core -->
      <circle cx="90" cy="90" r="4" fill="#38bdf8" filter="url(#hyperGlow)"/>
    </g>

    <!-- Description -->
    <g transform="translate(20, 260)">
      <text x="0" y="0" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">【科技感升级亮点】</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
        <tspan x="0" dy="0">• <tspan font-weight="700" fill="#c084fc">3D 拓扑扭曲（Möbius Twist）</tspan>：将扁平线条</tspan>
        <tspan x="0" dy="18">  重构为具有空间厚度与翻转交叠的立体缎带。</tspan>
        <tspan x="0" dy="24">• <tspan font-weight="700" fill="#38bdf8">光导纤维脊线（Spine Bus）</tspan>：在厚缎带内侧</tspan>
        <tspan x="0" dy="18">  嵌入亮色光脉冲导轨，宛如高带宽数据总线。</tspan>
        <tspan x="0" dy="24">• 兼备 Apple/OpenAI 旗舰设计的高级感，沉稳、</tspan>
        <tspan x="0" dy="18">  大气质感出众，既是无限环，又有现代雕塑美。</tspan>
      </text>

      <line x1="0" y1="130" x2="300" y2="130" stroke="#1e293b" stroke-width="1"/>

      <text x="0" y="152" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">【视觉气质】</text>
      <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
        <tspan x="0" dy="0">• 高级感：★★★★★  | 国际化质感：★★★★★</tspan>
        <tspan x="0" dy="18">• 在 App 桌面图标、官网大图、Favicon 表现均极强</tspan>
      </text>
    </g>
  </g>

  <!-- ════════ CARD 3: B3 (CYBER HUD / 赛博战术矩阵刻度) ════════ -->
  <g transform="translate(800, 126)" filter="url(#softCardShadow)">
    <rect width="340" height="520" rx="16" fill="url(#cardDarkB)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Top badge -->
    <rect x="16" y="16" width="92" height="22" rx="6" fill="#10b981" fill-opacity="0.18"/>
    <text x="62" y="31" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">B3 · 机甲战术</text>
    <text x="120" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">HUD 矩阵 · 机甲多边形</text>

    <!-- Canvas Box (180x180) -->
    <g transform="translate(80, 58)">
      <rect width="180" height="180" rx="32" fill="#080c16" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="60" fill="#10b981" fill-opacity="0.06"/>

      <!-- HUD Cockpit Corner Brackets -->
      <path d="M 28 44 L 28 28 L 44 28" fill="none" stroke="#334155" stroke-width="2"/>
      <path d="M 152 44 L 152 28 L 136 28" fill="none" stroke="#334155" stroke-width="2"/>
      <path d="M 28 136 L 28 152 L 44 152" fill="none" stroke="#334155" stroke-width="2"/>
      <path d="M 152 136 L 152 152 L 136 152" fill="none" stroke="#334155" stroke-width="2"/>

      <!-- Angular Hexagonal Infinity Loop (Stealth Mech style) -->
      <!-- Left Hex-Loop (Cyan) -->
      <polygon points="90,90 76,64 42,64 28,90 42,116 76,116" fill="none" stroke="#00f5ff" stroke-width="5" stroke-linejoin="round" filter="url(#hyperGlow)"/>

      <!-- Right Hex-Loop (Purple/Violet) -->
      <polygon points="90,90 104,116 138,116 152,90 138,64 104,64" fill="none" stroke="#a855f7" stroke-width="5" stroke-linejoin="round"/>

      <!-- Sensor Calibrations / Tick Marks on Hexagons -->
      <line x1="50" y1="64" x2="50" y2="58" stroke="#00f5ff" stroke-width="2"/>
      <line x1="60" y1="64" x2="60" y2="58" stroke="#00f5ff" stroke-width="2"/>
      <line x1="120" y1="116" x2="120" y2="122" stroke="#a855f7" stroke-width="2"/>
      <line x1="130" y1="116" x2="130" y2="122" stroke="#a855f7" stroke-width="2"/>

      <!-- Central Hex-Core Diamond (Targeting Reticle) -->
      <polygon points="90,82 98,90 90,98 82,90" fill="#ffffff" filter="url(#hyperGlow)"/>
      <line x1="90" y1="74" x2="90" y2="82" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="90" y1="98" x2="90" y2="106" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Description -->
    <g transform="translate(20, 260)">
      <text x="0" y="0" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">【科技感升级亮点】</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
        <tspan x="0" dy="0">• <tspan font-weight="700" fill="#34d399">赛博机甲硬折角</tspan>：用六边形多段折线重构</tspan>
        <tspan x="0" dy="18">  曲线，呈现军工/战术 HUD 抬头显示质感。</tspan>
        <tspan x="0" dy="24">• <tspan font-weight="700" fill="#00f5ff">准星与刻度传感器</tspan>：四角 HUD 括号定位点</tspan>
        <tspan x="0" dy="18">  配合折角刻度线，机械精密感十足。</tspan>
        <tspan x="0" dy="24">• 中心菱形晶核作为数据锁定标志，视觉冲击力</tspan>
        <tspan x="0" dy="18">  极强，工业重器风韵味浓郁。</tspan>
      </text>

      <line x1="0" y1="130" x2="300" y2="130" stroke="#1e293b" stroke-width="1"/>

      <text x="0" y="152" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">【视觉气质】</text>
      <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
        <tspan x="0" dy="0">• 战斗感：★★★★★  | 机械硬朗：★★★★★</tspan>
        <tspan x="0" dy="18">• 偏向重装机甲风格，与柔性圆润 UI 稍显反差</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 658)">
    <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DESIGN SUMMARY:</text>
    <text x="135" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      B1 强调粒子与算力流动；<tspan fill="#c084fc" font-weight="700">B2 达到国际顶尖科技公司的 3D 拓扑质感（最推荐）</tspan>；B3 呈现硬核战术 HUD 工业风。
    </text>
  </g>
</svg>
